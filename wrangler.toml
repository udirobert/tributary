name = "tributary-spike"
main = "src/index.ts"
compatibility_date = "2026-10-03"

[[artifacts]]
binding = "ARTIFACTS"
namespace = "default"
# Artifacts has no local simulator (wrangler source explicitly marks it
# "DO-NOT-USE-this-resource-will-never-have-a-local-simulator"), so the
# binding always connects to the remote Artifacts namespace. This means
# `npm run dev` requires a Cloudflare account on a Workers Paid plan
# (error 10403 is returned on the free tier) and a real Artifacts
# namespace on that account. See DECISIONS.md.
remote = true

[[durable_objects.bindings]]
name = "CLAIM_REGISTRY"
class_name = "ClaimRegistry"

[[migrations]]
tag = "v1"
new_classes = ["ClaimRegistry"]

[[queues.producers]]
queue = "merge-queue"
binding = "MERGE_QUEUE"

[[queues.consumers]]
queue = "merge-queue"
max_concurrency = 1
